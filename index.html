<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SxS - QY Maple</title>
    
    <link rel="icon" type="image/webp" href="https://github.com/QYMaple/sxs-research-global/blob/main/img/icon.png?raw=true">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J5GNDMEP1W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-J5GNDMEP1W');
    </script>
    
    <style>
    body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        -webkit-tap-highlight-color: transparent;
    }

    .container {
        width: 90%;
        max-width: 400px;
        text-align: center;
        padding: 40px 0;
    }

    h1 {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        color: #1d1d1f;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .btn-card {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        background-color: white;
        margin-bottom: 15px;
        padding: 10px;
        text-decoration: none;
        border-radius: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        box-sizing: border-box;
        overflow: hidden;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
    }

    .btn-card:active {
        transform: scale(0.98);
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .btn-img {
        width: 50px;
        height: 50px;
        border-radius: 10px;
        object-fit: cover;
        margin-right: 15px;
        flex-shrink: 0;
        background-color: white;
    }

    .btn-text {
        font-size: 1.05rem;
        font-weight: 600;
        color: #1d1d1f;
        text-align: left;
    }

    .btn-card-multiple {
        cursor: default !important;
    }
    .btn-links-group {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: flex-end;
        align-content: center;
        gap: 4px;
        margin-left: auto;
        overflow-x: auto;
    }

    .sub-link {
        flex-shrink: 0;
        width: 70px;
        padding: 4px 0;
        background: #f5f5f7;
        color: #0071e3;
        text-decoration: none;
        border-radius: 10px;
        font-size: 0.8rem;
        font-weight: 600;
        text-align: center;
        transition: all 0.2s ease;
    }
    .sub-link:active {
        transform: scale(0.95);
        background: #e8e8ed;
    }
    
    .footer {
        margin-top: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 0.85rem;
        color: #86868b;
    }
    .footer a {
        color: #bb271a;
        text-decoration: none;
        font-weight: 600;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sword x Staff Research Tab</h1>
        
        <a class="btn-card" href="https://ggl.link/qy-sxs-timeline">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E5%89%AF%E6%9C%AC.png?raw=true" alt="icon">
            <div class="btn-text">Season Timeline</div>
        </a>

        <div class="btn-card btn-card-multiple">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E6%B3%BD%E4%B9%8B%E5%9B%BD.png?raw=true" alt="icon">
        
            <div class="btn-text" style="flex-grow: 1;">Astral<br/>Destiny</div>
        
            <div class="btn-links-group">
                <a class="sub-link" href="https://ggl.link/qy-astral-s1-s3">S1~S3</a>
                <a class="sub-link" href="#">S4~S6</a>
                <a class="sub-link" href="#">S7~S9</a>
            </div>
        </div>

        <a class="btn-card" href="https://ggl.link/qy-treasure-hunt">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E7%A7%98%E5%AE%9D.png?raw=true" alt="icon">
            <div class="btn-text">Grand Treasure Hunt Timeline</div>
        </a>

        <a class="btn-card" href="https://ggl.link/qy-relic-stats">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E9%81%97%E7%89%A9.png?raw=true" alt="icon">
            <div class="btn-text">Relic Special Attributes</div>
        </a>

        <a class="btn-card" href="https://ggl.link/qy-companions">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E4%BC%99%E4%BC%B4.png?raw=true" alt="icon">
            <div class="btn-text">Companions Special Attributes</div>
        </a>
    
        <a class="btn-card" href="https://ggl.link/qy-limited-tips">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/MaoHeiHei.jpg?raw=true" alt="icon">
            <div class="btn-text">Limited Time Tips</div>
        </a>
        
        <a class="btn-card" href="https://ggl.link/qy-class-change">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/%E6%8A%80%E8%83%BD.png?raw=true" alt="icon">
            <div class="btn-text">Class Change Skill Conversion</div>
        </a>

        <a class="btn-card" href="https://discord.gg/qyuymQaeak">
            <img class="btn-img" src="https://github.com/QYMaple/sxs-research-global/blob/main/img/icon.png?raw=true" alt="icon">
            <div class="btn-text" style="color: #5865F2;">Join Discord Community</div>
        </a>
        
        <div class="footer">
            <span>Made by</span>
            <a href="https://swordxstaff.fandom.com/wiki/QY_Maple">QY Maple</a>
        </div>
    </div>
</body>
</html>
