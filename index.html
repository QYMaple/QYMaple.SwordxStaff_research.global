<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『QY Maple』Sword x Staff "All In One"</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 0;
        }
        h1 { font-size: 1.5rem; margin-bottom: 2rem; color: #1d1d1f; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin-bottom: 15px;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active { transform: scale(0.98); background-color: #005bbd; }
        
        /* 底部名字和链接并排样式 */
        .footer {
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #86868b;
        }
        .footer a {
            color: #0071e3;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Destination</h1>
        
        <a class="btn" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=0#gid=0">Main Timeline</a>

        <a class="btn" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=1227676989#gid=1227676989">Relic Special Stats</a>
        <a class="btn" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=1525661889#gid=1525661889">Companions Special Stats</a>
        <a class="btn" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=678470076#gid=678470076">Skill Quality Stats</a>
