<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『QY Maple』Sword x Staff "All In One"</title>
    
    <link rel="icon" type="image/webp" href="https://cdn.discordapp.com/icons/1457142172104261826/6a23e827ada903f225b1877377d4587b.webp?size=32">
    
    <script src="https://cdn.counter.dev/script.js" data-id="ff23c593-ffba-44d1-bef4-f53616e47cf3" data-utcoffset="8"></script>
    
    <style>
    body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
        -webkit-tap-highlight-color: transparent;
    }

    .container {
        width: 90%;
        max-width: 400px;
        text-align: center;
        padding: 40px 0;
    }

    h1 {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        color: #1d1d1f;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .btn-card {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        background-color: white;
        margin-bottom: 15px;
        padding: 10px;
        text-decoration: none;
        border-radius: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        box-sizing: border-box;
        overflow: hidden;
        z-index: 1;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
    }

    .btn-card:active {
        transform: scale(0.96);
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    @keyframes sweep {
        0% { clip-path: inset(0 0 98% 0); }
        25% { clip-path: inset(0 0 0 98%); }
        50% { clip-path: inset(98% 0 0 0); }
        75% { clip-path: inset(0 98% 0 0); }
        100% { clip-path: inset(0 0 98% 0); }
    }

    .btn-card.clicked::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 3px solid #0071e3;
        border-radius: 16px;
        pointer-events: none;
        z-index: 2;
        animation: sweep 0.8s linear forwards;
    }

    .btn-img {
        width: 50px;
        height: 50px;
        border-radius: 10px;
        object-fit: cover;
        margin-right: 15px;
        flex-shrink: 0;
        background-color: #f0f0f0;
    }

    .btn-text {
        font-size: 1.05rem;
        font-weight: 600;
        color: #1d1d1f;
        text-align: left;
    }

    .counter-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        margin: 10px 0 25px 0;
    }

    .visitor-stats {
        background: #1d1d1f;
        color: #00d4ff; 
        padding: 6px 16px;
        border-radius: 20px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 0.85rem;
        box-shadow: inset 0 0 8px rgba(0,212,255,0.3), 0 4px 10px rgba(0,0,0,0.1);
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,212,255,0.2);
    }
        
    .footer {
        margin-top: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 0.85rem;
        color: #86868b;
    }
    .footer a {
        color: #0071e3;
        text-decoration: none;
        font-weight: 600;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sword x Staff Info Menu</h1>
        
        <a class="btn-card" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=0#gid=0">
            <img class="btn-img" src="https://media.discordapp.net/attachments/1468015552772706420/1468015553779204136/2026-02-02_4.49.09.png?ex=6a0305c6&is=6a01b446&hm=f660d38b94402cf15d5c90f7750a247f3a94db7769ff90af9342444323c375eb&=&format=webp&quality=lossless&width=1076&height=768" alt="icon">
            <div class="btn-text">Game Timeline</div>
        </a>

        <a class="btn-card" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=902904783#gid=902904783">
            <img class="btn-img" src="https://media.discordapp.net/attachments/1487207422815637715/1487207423075815434/2026-01-27_10.16.24.png?ex=6a02f818&is=6a01a698&hm=f1eae1388f818ea8c2c2f8405ae0cde0778de7d0fcd13a23d99c08db65d696f1&=&format=webp&quality=lossless&width=1468&height=984" alt="icon">
            <div class="btn-text">Grand Treasure Hunt Timeline</div>
        </a>

        <a class="btn-card" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=1227676989#gid=1227676989">
            <img class="btn-img" src="https://media.discordapp.net/attachments/1495887209541402634/1495887209792929882/2026-04-20_3.41.29.png?ex=6a039087&is=6a023f07&hm=1cf2d568da8971cd3375fdfab23832eef72f46b12ae5c34714abab3272cefd43&=&format=webp&quality=lossless&width=196&height=200" alt="icon">
            <div class="btn-text">Relic Special Stats</div>
        </a>

        <a class="btn-card" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=1525661889#gid=1525661889">
            <img class="btn-img" src="https://media.discordapp.net/attachments/1495901771577688154/1495901772839911466/-.png?ex=6a02f557&is=6a01a3d7&hm=fbe938e78fd8817fc31cd7aa29b24f3d82dba00b4745924e9b52f01a5556d208&=&format=webp&quality=lossless&width=1600&height=1546" alt="icon">
            <div class="btn-text">Companions Special Stats</div>
        </a>

        <a class="btn-card" href="https://docs.google.com/spreadsheets/d/113BsBNGXrfGkIkYx7cWxPhzxIuQoUzENYiirpsqrp5A/edit?gid=678470076#gid=678470076">
            <img class="btn-img" src="https://media.discordapp.net/attachments/1485015817513992232/1485015817748746250/2026-01-23_1.05.01.png?ex=6a0390c1&is=6a023f41&hm=b6a5e4198032f5cf49799e4f6cdeb65983abd31d914248dbf9593eec2396c08f&=&format=webp&quality=lossless&width=2000&height=1338" alt="icon">
            <div class="btn-text">Skill Quality Stats</div>
        </a>

        <a class="btn-card" href="https://discord.gg/qyuymQaeak">
            <img class="btn-img" src="https://cdn.discordapp.com/icons/1457142172104261826/6a23e827ada903f225b1877377d4587b.webp?size=160&quality=lossless" alt="icon">
            <div class="btn-text" style="color: #5865F2;">Join Discord Community</div>
        </a>

        <div class="counter-wrapper">
            <div class="visitor-stats">
                Global Guide Clicks: <span id="click-count">Loading...</span>
            </div>
        </div>
        
        <div class="footer">
            <span>Made by</span>
            <a href="https://discord.gg/qyuymQaeak">QY Maple</a>
            <img src="https://cdn.discordapp.com/icons/1457142172104261826/6a23e827ada903f225b1877377d4587b.webp?size=160&quality=lossless" alt="Unique Visitors" style="height: 20px; vertical-align: middle; margin-left: 8px;">
        </div>
    </div>

    <script>
        const countElement = document.getElementById('click-count');
        const namespace = "qymaple_swordstaff_v2"; // 换个新ID重新开始
        const key = "total_clicks";
    
        // 自动更新显示并带上动画感
        function updateDisplay(val) {
            if(!val) return;
            countElement.style.opacity = 0;
            setTimeout(() => {
                countElement.innerText = Number(val).toLocaleString();
                countElement.style.opacity = 1;
            }, 200);
        }
    
        // 获取初始值
        async function initCount() {
            try {
                // 使用更稳定的 API 镜像
                const res = await fetch(`https://api.countapi.xyz/get/${namespace}/${key}`);
                const data = await res.json();
                updateDisplay(data.value || 0);
            } catch (e) {
                // 如果 API 挂了，显示一个动态的“模拟活跃人数”或者固定数字
                countElement.innerText = "0"; 
            }
        }
    
        initCount();
    
        document.querySelectorAll('.btn-card').forEach(card => {
            card.addEventListener('click', async function() {
                this.classList.remove('clicked');
                void this.offsetWidth; 
                this.classList.add('clicked');
    
                try {
                    const res = await fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`);
                    const data = await res.json();
                    updateDisplay(data.value);
                } catch (e) {
                    console.log("Counter offline");
                }
    
                setTimeout(() => { this.classList.remove('clicked'); }, 800);
            });
        });
    </script>
</body>
</html>
